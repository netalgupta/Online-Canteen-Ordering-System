<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Problem Reports — QueueLess</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/dashboard.css"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script></head><body><div class="dash-shell"><aside class="dash-sidebar"><a href="dashboard.html" class="brand"><span class="brand-mark">Q</span>QueueLess</a><nav class="dash-nav"><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a><a href="menu.html"><i data-lucide="utensils"></i> Menu Management</a><a href="analytics.html"><i data-lucide="bar-chart-3"></i> Analytics</a><a href="staff-access.html"><i data-lucide="users"></i> Staff Access</a><a class="active" href="reports.html"><i data-lucide="flag"></i> Problem Reports</a></nav><div class="dash-sidebar-foot">Logged in as Admin<br><a href="#" onclick="qlLogout();return false;" style="color:rgba(248,247,243,.7)">Log out</a></div></aside><main class="dash-main"><div class="dash-topbar"><div><h1 style="font-size:20px">Problem Reports</h1><p class="text-sm muted">Review and resolve student-submitted issues</p></div><button class="btn btn-outline" id="refresh">Refresh</button></div><div class="dash-content"><div id="reports" class="card card-pad"><p class="muted">Loading reports…</p></div></div></main></div><script src="../js/auth.js"></script><script src="../js/data.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/backend-config.js"></script><script src="../js/backend.js"></script><script src="../js/app.js"></script><script>if(!qlRequireRole('admin'))throw new Error('Unauthorized');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function loadReports(){const el=document.getElementById('reports');el.innerHTML='<p class="muted">Loading reports…</p>';try{const rows=await window.qlBackend.adminListProblems();el.innerHTML=rows.length?rows.map(r=>`<article style="padding:16px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><strong>${esc(r.problem_type)} · ${esc(r.student_name||r.student_email)}</strong><span class="pill ${r.status==='resolved'?'pill-teal':'pill-amber'}">${esc(r.status)}</span></div><p class="text-xs muted" style="margin:6px 0">${esc(r.student_email)} · ${new Date(r.created_at).toLocaleString()}${r.order_reference?' · Order: '+esc(r.order_reference):''}</p><p style="white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0">${esc(r.description)}</p>${r.admin_note?`<p class="text-sm muted">Admin note: ${esc(r.admin_note)}</p>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap"><select id="status-${esc(r.id)}"><option value="open" ${r.status==='open'?'selected':''}>Open</option><option value="in_progress" ${r.status==='in_progress'?'selected':''}>In progress</option><option value="resolved" ${r.status==='resolved'?'selected':''}>Resolved</option></select><input id="note-${esc(r.id)}" placeholder="Internal note (optional)" value="${esc(r.admin_note||'')}" style="flex:1;min-width:180px"><button class="btn btn-primary btn-sm" onclick="saveReport('${esc(r.id)}')">Save update</button></div></article>`).join(''):'<p class="muted">No problem reports submitted yet.</p>';if(window.lucide)lucide.createIcons();}catch(e){el.innerHTML='<p style="color:var(--crimson-dark)">Could not load reports: '+esc(e.message)+'</p>';}}async function saveReport(id){try{await window.qlBackend.updateProblemStatus(id,document.getElementById('status-'+id).value,document.getElementById('note-'+id).value);await loadReports();}catch(e){alert(e.message||'Could not update report.');}}document.getElementById('refresh').onclick=loadReports;loadReports();</script></body></html>
