<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set new password — QueueLess</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-card{width:100%; max-width:400px;}
  .auth-brand{display:flex; align-items:center; gap:9px; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:20px; margin-bottom:26px;}
  .auth-card .card{padding:32px;}
  .auth-card h1{font-size:22px; margin-bottom:6px;}
  .auth-card p.sub{color:var(--ink-soft); font-size:13.5px; margin-bottom:24px;}
  .auth-foot{text-align:center; margin-top:20px; font-size:13.5px; color:var(--ink-soft);}
  .auth-foot a{color:var(--amber); font-weight:600;}
  .form-error{background:var(--red-tint); color:var(--red); font-size:13px; padding:10px 14px; border-radius:var(--radius-s); margin-bottom:16px; display:none;}
  .form-error.show{display:block;}
  .form-ok{background:var(--teal-tint); color:var(--teal); font-size:13px; padding:10px 14px; border-radius:var(--radius-s); margin-bottom:16px; display:none;}
  .form-ok.show{display:block;}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="/index.html" class="auth-brand"><span class="brand-mark">Q</span>QueueLess</a>
    <div class="card">
      <h1>Set a new password</h1>
      <p class="sub">Choose a new password for your account.</p>

      <div class="form-error" id="err"></div>
      <div class="form-ok" id="ok"></div>

      <form id="reset-form">
        <div class="field">
          <label>New password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="field">
          <label>Confirm password</label>
          <input type="password" id="confirm" placeholder="Re-enter password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Update Password</button>
      </form>
    </div>
    <p class="auth-foot"><a href="/login.html">Back to log in</a></p>
  </div>
</div>

<script type="module" src="/js/pages/reset.js"></script>
</body>
</html>
