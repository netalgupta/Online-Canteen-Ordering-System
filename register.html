<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — QueueLess</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-card{width:100%; max-width:420px;}
  .auth-brand{display:flex; align-items:center; gap:9px; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:20px; margin-bottom:26px;}
  .auth-card .card{padding:32px;}
  .auth-card h1{font-size:22px; margin-bottom:6px;}
  .auth-card p.sub{color:var(--ink-soft); font-size:13.5px; margin-bottom:24px;}
  .auth-foot{text-align:center; margin-top:20px; font-size:13.5px; color:var(--ink-soft);}
  .auth-foot a{color:var(--amber); font-weight:600;}
  .role-quick{display:flex; gap:8px; margin-bottom:20px;}
  .role-quick button{flex:1; padding:9px; border:1.5px solid var(--line); border-radius:999px; background:var(--white); font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .role-quick button.active{border-color:var(--band); background:var(--band); color:#fff;}
  .oauth-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:12px; border:1.5px solid var(--line); border-radius:999px; background:var(--white); font-weight:600; font-size:14px; color:var(--ink);}
  .oauth-btn:hover{border-color:var(--ink-soft);}
  .oauth-btn img{width:18px; height:18px;}
  .divider{display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--ink-soft); font-size:12px;}
  .divider::before, .divider::after{content:''; flex:1; height:1px; background:var(--line);}
  .form-error{background:var(--red-tint); color:var(--red); font-size:13px; padding:10px 14px; border-radius:var(--radius-s); margin-bottom:16px; display:none;}
  .form-error.show{display:block;}
  .form-ok{background:var(--teal-tint); color:var(--teal); font-size:13px; padding:10px 14px; border-radius:var(--radius-s); margin-bottom:16px; display:none;}
  .form-ok.show{display:block;}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="/index.html" class="auth-brand"><span class="brand-mark">Q</span>QueueLess</a>
    <div class="card">
      <h1>Create your account</h1>
      <p class="sub">Set up once, order for the rest of the semester.</p>

      <div class="form-error" id="err"></div>
      <div class="form-ok" id="ok"></div>

      <button type="button" class="oauth-btn" id="google-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""> Sign up with Google
      </button>

      <div class="divider">or</div>

      <div class="role-quick" id="role-quick">
        <button type="button" class="active" data-role="student">Student</button>
        <button type="button" data-role="staff">Staff</button>
        <button type="button" data-role="admin">Admin</button>
      </div>

      <form id="register-form">
        <div class="field">
          <label>Full name</label>
          <input type="text" id="name" placeholder="Arya Sharma" required>
        </div>
        <div class="field">
          <label>College email</label>
          <input type="email" id="email" placeholder="arya@somaiya.edu" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create Account <i data-lucide="arrow-right"></i></button>
      </form>
    </div>
    <p class="auth-foot">Already have an account? <a href="/login.html">Log in</a></p>
  </div>
</div>

<script type="module" src="/js/pages/register.js"></script>
</body>
</html>
