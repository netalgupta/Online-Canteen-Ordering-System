<meta name="robots" content="noindex,nofollow"><title>Contact Us — QueueLess</title><link rel="stylesheet" href="../css/style.css"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script><style>.account-page{max-width:680px;margin:0 auto;padding:18px 0 70px}.account-head{margin:22px 0}.account-head h1{font-size:24px;margin-bottom:5px}.setting-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}.faq{border-bottom:1px solid var(--line);padding:15px 0}.faq summary{cursor:pointer;font-weight:600;font-size:14px}.faq p{color:var(--ink-soft);font-size:13px;line-height:1.6;margin:10px 0 0}.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.toggle-row:last-child{border-bottom:0}.toggle-copy strong{display:block;font-size:14px}.toggle-copy span{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px}.toggle{width:46px;height:26px;appearance:none;background:#ddd;border-radius:99px;position:relative;cursor:pointer}.toggle:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}.toggle:checked{background:var(--crimson)}.toggle:checked:before{transform:translateX(20px)}.legal p{font-size:13px;line-height:1.7;color:var(--ink-soft)}.contact-option{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.contact-option:last-child{border-bottom:0}.contact-icon{width:38px;height:38px;border-radius:11px;background:var(--crimson-tint);color:var(--crimson);display:grid;place-items:center}.search-help{margin-bottom:10px}@media(max-width:600px){.account-page{padding:8px 0 60px}}</style></head><body><nav class="topnav"><div class="topnav-inner"><a href="dashboard.html" class="brand"><span class="brand-mark">Q</span>QueueLess</a><div class="nav-right"><a href="profile.html" class="avatar">P</a></div></div></nav><main class="container account-page"><div class="page-exit-row"><a href="profile.html" class="page-back"><i data-lucide="arrow-left"></i> Back to profile</a></div><div class="account-head"><h1>Contact Us</h1><p class="muted text-sm">Siddhi Services Canteen</p></div><div class="setting-card"><div class="contact-option"><span class="contact-icon"><i data-lucide="mail"></i></span><div><strong>Email Support</strong><div class="muted text-sm">support@queueless.example</div></div></div><div class="contact-option"><span class="contact-icon"><i data-lucide="phone"></i></span><div><strong>Canteen Counter</strong><div class="muted text-sm">Ask staff at the appropriate pickup counter</div></div></div><div class="contact-option"><span class="contact-icon"><i data-lucide="clock"></i></span><div><strong>Operating Hours</strong><div class="muted text-sm">8:00 AM – 7:00 PM</div></div></div></div></main><script src="../js/auth.js"></script><script src="../js/data.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/backend-config.js"></script><script src="../js/backend.js"></script><script src="../js/app.js"></script><script>if(!qlRequireAuth()){throw new Error('Unauthorized');}</script><script></script></body></html>
