<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Menu — QueueLess</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  .menu-head{padding:32px 0 6px;}
  .menu-head h1{font-size:30px;}
  .menu-group-note{margin-top:6px; color:var(--ink-soft);}
  .menu-list-mode{max-width:900px;margin:0 auto 50px;}
  .menu-list-row{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;transition:.15s ease;}
  .menu-list-row:hover{border-color:var(--crimson-light);box-shadow:var(--shadow-s);}
  .menu-list-main{display:flex;align-items:flex-start;gap:12px;min-width:0;}
  .menu-list-main h4{font-size:15px;margin:0 0 5px;font-family:var(--font-body);}
  .menu-list-meta{display:flex;align-items:center;gap:7px;color:var(--ink-soft);font-size:11.5px;flex-wrap:wrap;}
  .popular-mark{color:var(--crimson);font-weight:700;}
  .menu-list-action{display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .menu-list-action strong{font-family:var(--font-mono);font-size:15px;}
  @media(max-width:600px){.menu-list-row{align-items:flex-start}.menu-list-action{flex-direction:column;gap:7px}.menu-list-action .btn{width:100%;}.menu-list-main h4{font-size:14px;}}

  .toolbar{display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:18px 0 20px;}
  .search-inline{position:relative; flex:1; min-width:220px;}
  .search-inline input{width:100%; padding:11px 14px 11px 40px; border-radius:999px; border:1.5px solid var(--line); background:var(--white); font-size:14px;}
  .search-inline svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-soft);}
  select.sort-select{padding:11px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--white); font-size:13.5px; font-weight:600;}
  .cat-filter-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:16px; margin-bottom:8px;}
  .coming-soon{max-width:560px;margin:30px auto 70px;padding:34px 24px;text-align:center;border:1px dashed var(--line-strong);border-radius:22px;background:var(--near-white);}
  .coming-icon{width:52px;height:52px;border-radius:16px;background:var(--crimson-tint);color:var(--crimson);display:grid;place-items:center;margin:0 auto 14px;}
  .coming-soon h3{font-size:19px;}
  .coming-soon p{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.6;}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="dashboard.html" class="brand"><span class="brand-mark">Q</span>QueueLess</a>
    <div class="nav-links">
      <a href="dashboard.html">Home</a>
      <a href="menu.html" class="active">Menu</a>
      <a href="history.html">Orders</a>
      <a href="profile.html">Profile</a>
    </div>
    <div class="nav-right">
      <a href="cart.html" class="cart-btn"><i data-lucide="shopping-bag" style="width:19px;height:19px;"></i><span class="cart-count">0</span></a>
      <a href="profile.html" class="avatar">A</a>
    </div>
  </div>
</nav>

<div class="container"><div class="page-exit-row"><a href="dashboard.html" class="page-back"><i data-lucide="arrow-left"></i> Back to home</a><a href="profile.html" class="page-back">Profile</a></div>
  <div class="menu-head">
    <h1 id="menu-title">Full Menu</h1>
    <p id="menu-note" class="menu-group-note text-sm">Prep time shown on every item — no surprises at checkout.</p>
  </div>

  <div class="toolbar">
    <div class="search-inline">
      <i data-lucide="search"></i>
      <input type="text" id="q" placeholder="Search food...">
    </div>
    <select class="sort-select" id="sort">
      <option value="popular">Popular</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="prep-asc">Fastest Prep</option>
    </select>
  </div>

  <div class="cat-filter-row" id="cat-filter"></div>

  <div class="grid grid-4" id="menu-grid" style="margin-bottom:50px;"></div>
</div>

<script src="../js/auth.js"></script>
<script src="../js/data.js"></script><script src="../js/backend.js"></script>
<script src="../js/orders.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/menu.js"></script>
<script>if(!qlRequireRole('student')){throw new Error('Unauthorized');}</script>
<script src="../js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const state = {
    query: params.get('q') || '',
    category: params.get('cat') || 'All',
    group: params.get('group') || '',
    sort: 'popular'
  };
  document.getElementById('q').value = state.query;
  const groupTitle = state.group || (state.category !== 'All' ? state.category : 'Full Menu');
  document.getElementById('menu-title').textContent = groupTitle;
  document.getElementById('menu-note').textContent = state.group ? 'Browse every item in this section and add directly to your cart.' : 'Prep time shown on every item — no surprises at checkout.';

  const categories = ['All', ...new Set(qlGetMenu().map(i=>i.category))];
  function renderCatFilter(){
    document.getElementById('cat-filter').style.display = state.group ? 'none' : 'flex';
    document.getElementById('cat-filter').innerHTML = categories.map(c=>
      `<button class="category-chip ${c===state.category?'active':''}" data-cat="${c}">${c}</button>`
    ).join('');
    document.querySelectorAll('.category-chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.category = btn.dataset.cat; render(); });
    });
  }

  function render(){
    renderCatFilter();
    const items = qlFilterMenu(state);
    const grid = document.getElementById('menu-grid');
    if(state.group){
      grid.className = 'menu-list-mode';
      if(items.length === 0){
        grid.innerHTML = `<div class="coming-soon"><div class="coming-icon"><i data-lucide="sparkles"></i></div><h3>No items listed</h3><p>There are no items listed in this section right now.</p></div>`;
        qlIcons();
      } else {
        qlRenderMenuList(grid, items);
      }
    } else {
      grid.className = 'grid grid-4';
      qlRenderMenuGrid(grid, items);
    }
    qlUpdateCartBadge();
  }

  document.getElementById('q').addEventListener('input', (e)=>{ state.query = e.target.value; render(); });
  document.getElementById('sort').addEventListener('change', (e)=>{ state.sort = e.target.value; render(); });

  render();
</script>
</body>
</html>
