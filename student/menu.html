<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — QueueLess</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  .menu-head{padding:32px 0 6px;}
  .menu-head h1{font-size:26px;}
  .toolbar{display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:18px 0 20px;}
  .search-inline{position:relative; flex:1; min-width:220px;}
  .search-inline input{width:100%; padding:11px 14px 11px 40px; border-radius:999px; border:1.5px solid var(--line); background:var(--white); font-size:14px;}
  .search-inline svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-soft);}
  select.sort-select{padding:11px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--white); font-size:13.5px; font-weight:600;}
  .veg-toggle{display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--white); font-size:13.5px; font-weight:600; cursor:pointer;}
  .cat-filter-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:16px; margin-bottom:8px;}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="dashboard.html" class="brand"><span class="brand-mark">Q</span>QueueLess</a>
    <div class="nav-links">
      <a href="dashboard.html">Home</a>
      <a href="menu.html" class="active">Menu</a>
      <a href="history.html">Orders</a>
      <a href="profile.html">Profile</a>
    </div>
    <div class="nav-right">
      <a href="cart.html" class="cart-btn"><i data-lucide="shopping-bag" style="width:19px;height:19px;"></i><span class="cart-count">0</span></a>
      <a href="profile.html" class="avatar">A</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="menu-head">
    <h1>Full Menu</h1>
    <p class="muted text-sm">Prep time shown on every item — no surprises at checkout.</p>
  </div>

  <div class="toolbar">
    <div class="search-inline">
      <i data-lucide="search"></i>
      <input type="text" id="q" placeholder="Search food...">
    </div>
    <label class="veg-toggle"><input type="checkbox" id="veg-only" style="width:auto;"> Veg only</label>
    <select class="sort-select" id="sort">
      <option value="popular">Popular</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="prep-asc">Fastest Prep</option>
    </select>
  </div>

  <div class="cat-filter-row" id="cat-filter"></div>

  <div class="grid grid-4" id="menu-grid" style="margin-bottom:50px;"></div>
</div>

<script src="../js/data.js"></script>
<script src="../js/orders.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const state = {
    query: params.get('q') || '',
    category: params.get('cat') || 'All',
    vegOnly: false,
    sort: 'popular'
  };
  document.getElementById('q').value = state.query;

  const categories = ['All', ...new Set(qlGetMenu().map(i=>i.category))];
  function renderCatFilter(){
    document.getElementById('cat-filter').innerHTML = categories.map(c=>
      `<button class="category-chip ${c===state.category?'active':''}" data-cat="${c}">${c}</button>`
    ).join('');
    document.querySelectorAll('.category-chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.category = btn.dataset.cat; render(); });
    });
  }

  function render(){
    renderCatFilter();
    const items = qlFilterMenu(state);
    qlRenderMenuGrid(document.getElementById('menu-grid'), items);
    qlUpdateCartBadge();
  }

  document.getElementById('q').addEventListener('input', (e)=>{ state.query = e.target.value; render(); });
  document.getElementById('veg-only').addEventListener('change', (e)=>{ state.vegOnly = e.target.checked; render(); });
  document.getElementById('sort').addEventListener('change', (e)=>{ state.sort = e.target.value; render(); });

  render();
</script>
</body>
</html>
