<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — QueueLess</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  .greet{padding:36px 0 6px;}
  .greet h1{font-size:28px;}
  .greet p{color:var(--ink-soft); margin-top:4px;}
  .search-bar{position:relative; margin:22px 0 28px;}
  .search-bar input{width:100%; padding:14px 16px 14px 44px; border-radius:999px; border:1.5px solid var(--line); background:var(--white); font-size:14.5px;}
  .search-bar svg{position:absolute; left:16px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--ink-soft);}

  .cat-row{display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; margin-bottom:34px;}
  .cat-pill{flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:8px; width:84px;}
  .cat-pill .ic{width:56px; height:56px; border-radius:16px; background:var(--white); border:1px solid var(--line); display:flex; align-items:center; justify-content:center;}
  .cat-pill span{font-size:12px; font-weight:600; text-align:center; color:var(--ink-soft);}
  .cat-pill:hover .ic{border-color:var(--ink);}

  .active-order-card{background:var(--ink); color:var(--paper); border-radius:var(--radius-l); padding:26px; position:relative; overflow:hidden; margin-bottom:34px;}
  .active-order-card::before{content:''; position:absolute; inset:0; background:radial-gradient(circle at 90% 0%, rgba(255,107,53,.22), transparent 55%);}
  .ao-top{display:flex; justify-content:space-between; align-items:flex-start; position:relative;}
  .ao-id{font-family:var(--font-mono); font-size:13px; color:rgba(248,247,243,.6);}
  .ao-status{font-size:20px; font-family:var(--font-display); font-weight:700; margin-top:4px;}
  .ao-meta{display:flex; gap:28px; margin-top:18px; position:relative;}
  .ao-meta div .l{font-size:11.5px; color:rgba(248,247,243,.55); text-transform:uppercase; letter-spacing:.04em;}
  .ao-meta div .v{font-family:var(--font-mono); font-size:17px; font-weight:700; margin-top:3px;}
  .ao-progress{margin-top:20px; position:relative;}
  .ao-progress .progress{background:rgba(248,247,243,.15);}

  .section-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .section-head h2{font-size:19px;}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="dashboard.html" class="brand"><span class="brand-mark">Q</span>QueueLess</a>
    <div class="nav-links">
      <a href="dashboard.html" class="active">Home</a>
      <a href="menu.html">Menu</a>
      <a href="history.html">Orders</a>
      <a href="profile.html">Profile</a>
    </div>
    <div class="nav-right">
      <a href="cart.html" class="cart-btn"><i data-lucide="shopping-bag" style="width:19px;height:19px;"></i><span class="cart-count">0</span></a>
      <a href="profile.html" class="avatar" id="avatar-init">A</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="greet">
    <h1>Good afternoon, <span id="student-name">Student</span> 👋</h1>
    <p>What are you craving today?</p>
  </div>

  <div class="search-bar">
    <i data-lucide="search"></i>
    <input type="text" id="home-search" placeholder="Search food, drinks and snacks..." onkeydown="if(event.key==='Enter'){window.location.href='menu.html?q='+encodeURIComponent(this.value)}">
  </div>

  <div class="cat-row" id="cat-row"></div>

  <div id="active-order-slot"></div>

  <div class="section-head">
    <h2>Popular Today</h2>
    <a href="menu.html" class="text-sm muted">View full menu →</a>
  </div>
  <div class="grid grid-4" id="popular-grid" style="margin-bottom:40px;"></div>
</div>

<footer class="site-footer"><div class="container"><span>QueueLess</span><span>Main College Canteen</span></div></footer>

<script src="../js/data.js"></script>
<script src="../js/orders.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/app.js"></script>
<script>
  const user = qlGetUser();
  document.getElementById('student-name').textContent = user.name || 'Student';
  document.getElementById('avatar-init').textContent = (user.name||'S').charAt(0).toUpperCase();

  const CATS = [
    {name:'Snacks', icon:'sandwich'},
    {name:'Meals', icon:'soup'},
    {name:'Beverages', icon:'cup-soda'},
    {name:'Tea & Coffee', icon:'coffee'},
    {name:'Desserts', icon:'cake-slice'},
  ];
  document.getElementById('cat-row').innerHTML = CATS.map(c=>`
    <a href="menu.html?cat=${encodeURIComponent(c.name)}" class="cat-pill">
      <div class="ic"><i data-lucide="${c.icon}" style="width:24px;height:24px;"></i></div>
      <span>${c.name}</span>
    </a>`).join('');

  // Active order widget
  const active = qlLatestActiveOrder();
  const slot = document.getElementById('active-order-slot');
  if(active){
    const statusOrder = ['received','accepted','preparing','ready','collected'];
    const pct = Math.round(((statusOrder.indexOf(active.status)+1) / 4) * 100);
    const qPos = qlQueuePosition(active.id);
    slot.innerHTML = `
      <div class="active-order-card">
        <div class="ao-top">
          <div>
            <div class="ao-id">ORDER #${active.id}</div>
            <div class="ao-status">${QL_STATUS_LABEL[active.status]}</div>
          </div>
          <span class="pill pill-amber"><span class="pill-dot"></span>Live</span>
        </div>
        <div class="ao-meta">
          <div><div class="l">Estimated Ready</div><div class="v">${active.pickupTime}</div></div>
          <div><div class="l">Queue Position</div><div class="v">${active.status==='ready'||active.status==='collected' ? '—' : qPos}</div></div>
        </div>
        <div class="ao-progress">
          <div class="progress"><div class="progress-fill" style="width:${Math.min(pct,100)}%"></div></div>
        </div>
        <a href="track.html?id=${active.id}" class="btn btn-amber btn-sm mt-16">Track Order <i data-lucide="arrow-right" style="width:14px;height:14px;"></i></a>
      </div>`;
  }

  // Popular items
  const popular = qlGetMenu().filter(i=>i.popular).slice(0,4);
  qlRenderMenuGrid(document.getElementById('popular-grid'), popular.length ? popular : qlGetMenu().slice(0,4));
</script>
</body>
</html>
