<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Order History — QueueLess</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  .hist-list{padding:26px 0 60px; display:flex; flex-direction:column; gap:14px;}
  .hist-row{display:flex; align-items:center; gap:16px; padding:18px; flex-wrap:wrap;}
  .hist-id{font-family:var(--font-mono); font-weight:700; font-size:15px;}
  .hist-items{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .hist-date{font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); margin-top:4px;}
  .hist-right{margin-left:auto; display:flex; align-items:center; gap:12px;}
  .hist-price{font-family:var(--font-mono); font-weight:700;}

  .hist-order-card{display:block;padding:20px;}
  .hist-order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px;}
  .hist-track-list{border-top:1px solid var(--line);}
  .hist-track-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
  .hist-track-main{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .hist-track-main strong{font-size:14px;}
  .hist-track-main span{font-size:11.5px;color:var(--ink-soft)}
  .hist-status-link{display:inline-flex;text-decoration:none;cursor:pointer} .hist-status-link:hover{transform:translateY(-1px);box-shadow:var(--shadow-s)}
  .hist-actions{padding-top:14px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
  .order-tabs{display:flex;gap:8px;padding:5px;background:var(--paper-dim);border:1px solid var(--line);border-radius:14px;width:fit-content;box-shadow:var(--shadow-s);}
  .order-tab{appearance:none;border:0;background:transparent;color:var(--ink-soft);font:600 13px var(--font-display);padding:10px 18px;border-radius:10px;cursor:pointer;transition:all .18s ease;white-space:nowrap;}
  .order-tab:hover{color:var(--ink);background:var(--white);}
  .order-tab.active{background:var(--white);color:var(--crimson-dark);box-shadow:0 2px 8px rgba(0,0,0,.07);}
  .order-tab:focus-visible{outline:2px solid var(--crimson-light);outline-offset:2px;}
  @media(max-width:600px){.order-tabs{width:100%;}.order-tab{flex:1;text-align:center;padding:10px 12px;}}
  @media(max-width:600px){.hist-order-top{flex-direction:column;}.hist-track-row{align-items:flex-start;}.hist-track-row .btn{flex-shrink:0;}.hist-actions .btn{width:100%;}}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="dashboard.html" class="brand"><span class="brand-mark">Q</span>QueueLess</a>
    <div class="nav-links"><a href="dashboard.html">Home</a><a href="menu.html">Menu</a><a href="history.html" class="active">Orders</a><a href="profile.html">Profile</a></div>
    <div class="nav-right"><a href="cart.html" class="cart-btn"><i data-lucide="shopping-bag" style="width:19px;height:19px;"></i><span class="cart-count">0</span></a></div>
  </div>
</nav>

<div class="container"><div class="page-exit-row"><a href="dashboard.html" class="page-back"><i data-lucide="arrow-left"></i> Back to home</a><a href="profile.html" class="page-back">Profile</a></div>
  <h1 style="font-size:24px; margin-top:28px;">My Orders</h1>
  <p class="muted text-sm">View your active orders and completed order history.</p>
  <div class="order-tabs" style="margin-top:20px" role="tablist" aria-label="Order history"><button class="order-tab active" id="tab-active" role="tab" aria-selected="true">Active Orders</button><button class="order-tab" id="tab-past" role="tab" aria-selected="false">Past Orders</button></div>
  <div class="hist-list" id="hist-list"></div>
</div>

<script src="../js/auth.js"></script>
<script src="../js/data.js"></script><script src="../js/backend.js"></script>
<script src="../js/orders.js"></script>
<script src="../js/cart.js"></script>
<script>if(!qlRequireRole('student')){throw new Error('Unauthorized');}</script>
<script src="../js/app.js"></script>
<script>
  let currentTab='active';
  function render(){
    if(typeof qlProcessItemReadiness==='function') qlProcessItemReadiness();
    const orders = qlGetStudentOrders().filter(o=>Array.isArray(o.items)&&o.items.some(ci=>Number(ci.qty)>0)&&Array.isArray(o.itemTracks)&&o.itemTracks.some(t=>t&&t.trackId&&Number(t.qty)>0)).slice().sort((a,b)=>b.createdAt-a.createdAt);
    const list=document.getElementById('hist-list'), menu=qlGetMenu();
    const active=orders.filter(o=>o.status!=='collected'&&o.status!=='cancelled');
    const past=orders.filter(o=>o.status==='collected'||o.status==='cancelled');
    const shown=currentTab==='active'?active:past;
    if(!shown.length){list.innerHTML=`<div class="empty-state"><i data-lucide="receipt"></i><p>${currentTab==='active'?'No active orders.':'No past orders yet.'}</p>${currentTab==='active'?'<a href="menu.html" class="btn btn-primary btn-sm mt-16">Browse Menu</a>':''}</div>`;qlIcons();return;}
    list.innerHTML=shown.map(o=>{
      const tracks=(o.itemTracks||[]).filter(t=>t&&t.trackId&&Number(t.qty)>0);
      const statusLabel=o.status==='collected'?'Order Collected':(tracks.some(t=>t.status==='ready')?'Item ready for pickup':QL_STATUS_LABEL[o.status]);
      const statusPill=o.status==='collected'?'pill-muted':(tracks.some(t=>t.status==='ready')?'pill-amber':'pill-teal');
      const firstOpen=tracks.find(t=>t.status!=='collected')||tracks[0];
      const itemCount=tracks.reduce((n,t)=>n+Number(t.qty||0),0);
      const itemNames=tracks.map(t=>{const m=menu.find(x=>x.id===t.id);return `${m?m.name:'Item'} × ${t.qty}`;}).join(' · ');
      return `<div class="ticket hist-row hist-order-card"><div class="hist-order-top"><div><div class="hist-id">ORDER #${o.id}</div><div class="hist-date">${o.pickupDateLabel||'Pickup'} · ${o.pickupTime} · ${itemCount} item${itemCount===1?'':'s'}</div></div><span class="pill ${statusPill}"><span class="pill-dot"></span>${statusLabel}</span></div><div class="hist-item-preview">${itemNames}</div><div class="hist-actions"><a href="order.html?id=${encodeURIComponent(o.id)}" class="btn btn-outline btn-sm">View Order</a>${o.status!=='collected'&&o.status!=='cancelled'&&firstOpen?`<a href="track.html?id=${encodeURIComponent(o.id)}&track=${encodeURIComponent(firstOpen.trackId)}" class="btn btn-primary btn-sm">Track Order <i data-lucide="navigation"></i></a>`:''}</div></div>`;
    }).join('');qlIcons();
  }
  document.getElementById('tab-active').onclick=()=>{currentTab='active';document.getElementById('tab-active').classList.add('active');document.getElementById('tab-past').classList.remove('active');document.getElementById('tab-active').setAttribute('aria-selected','true');document.getElementById('tab-past').setAttribute('aria-selected','false');render()};
  document.getElementById('tab-past').onclick=()=>{currentTab='past';document.getElementById('tab-past').classList.add('active');document.getElementById('tab-active').classList.remove('active');document.getElementById('tab-past').setAttribute('aria-selected','true');document.getElementById('tab-active').setAttribute('aria-selected','false');render()};
  render();
</script>
</body>
</html>
