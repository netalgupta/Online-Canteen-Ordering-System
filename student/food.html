<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Details — QueueLess</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  .food-detail{padding:30px 0 60px; display:grid; grid-template-columns:1fr 1fr; gap:44px; align-items:flex-start;}
  .fd-img{width:100%; height:340px; border-radius:var(--radius-l); background-size:cover; background-position:center; border:1px solid var(--line);}
  .fd-back{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; color:var(--ink-soft); margin-bottom:18px;}
  .fd-title-row{display:flex; justify-content:space-between; align-items:flex-start; gap:14px;}
  .fd-title-row h1{font-size:26px;}
  .fd-price{font-family:var(--font-mono); font-weight:700; font-size:22px;}
  .fd-meta-row{display:flex; gap:10px; margin:14px 0 18px;}
  .fd-desc{color:var(--ink-soft); font-size:14.5px; line-height:1.7; margin-bottom:26px;}
  .qty-row{display:flex; align-items:center; gap:16px; margin-bottom:22px;}
  .qty-control{display:flex; align-items:center; border:1.5px solid var(--line); border-radius:999px;}
  .qty-control button{width:38px; height:38px; background:none; border:none; font-size:17px; font-weight:600;}
  .qty-control span{width:32px; text-align:center; font-family:var(--font-mono); font-weight:700;}
  .fd-total{font-size:14px; color:var(--ink-soft);}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="dashboard.html" class="brand"><span class="brand-mark">Q</span>QueueLess</a>
    <div class="nav-links"><a href="dashboard.html">Home</a><a href="menu.html" class="active">Menu</a><a href="history.html">Orders</a><a href="profile.html">Profile</a></div>
    <div class="nav-right">
      <a href="cart.html" class="cart-btn"><i data-lucide="shopping-bag" style="width:19px;height:19px;"></i><span class="cart-count">0</span></a>
      <a href="profile.html" class="avatar">A</a>
    </div>
  </div>
</nav>

<div class="container">
  <a href="menu.html" class="fd-back" style="margin-top:24px;"><i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Back to menu</a>
  <div class="food-detail" id="food-detail"></div>
</div>

<script src="../js/data.js"></script>
<script src="../js/orders.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/app.js"></script>
<script>
  const id = new URLSearchParams(window.location.search).get('id');
  const item = qlGetMenu().find(i=>i.id===id);
  let qty = 1;

  if(!item){
    document.getElementById('food-detail').innerHTML = `<div class="empty-state"><p>Item not found.</p></div>`;
  } else {
    document.getElementById('food-detail').innerHTML = `
      <div class="fd-img" style="background-image:url('${item.img}')"></div>
      <div>
        <div class="fd-title-row">
          <div>
            <h1>${item.name}</h1>
            <span class="text-xs muted">${item.category}</span>
          </div>
          <span class="fd-price">₹${item.price}</span>
        </div>
        <div class="fd-meta-row">
          <span class="pill ${item.available?'pill-teal':'pill-red'}"><span class="pill-dot"></span>${item.available?'Available':'Out of stock'}</span>
          <span class="pill pill-muted"><i data-lucide="clock" style="width:12px;height:12px;"></i> ~${item.prepTime} min</span>
          <span class="pill pill-muted">${item.veg?'🟢 Veg':'🔴 Non-veg'}</span>
        </div>
        <p class="fd-desc">${item.desc}</p>

        <div class="field">
          <label>Special instructions (optional)</label>
          <textarea id="instructions" rows="2" placeholder="e.g. Less spicy, no onions"></textarea>
        </div>

        <div class="qty-row">
          <span class="text-sm" style="font-weight:600;">Quantity</span>
          <div class="qty-control">
            <button id="qty-dec">−</button>
            <span id="qty-val">1</span>
            <button id="qty-inc">+</button>
          </div>
        </div>

        <button class="btn btn-primary btn-block" id="add-cart-btn" ${!item.available?'disabled':''}>
          ${item.available ? `Add to Cart — ₹<span id="fd-total">${item.price}</span>` : 'Currently Unavailable'}
        </button>
      </div>`;
    qlIcons();

    document.getElementById('qty-inc').addEventListener('click', ()=>{ qty++; updateQty(); });
    document.getElementById('qty-dec').addEventListener('click', ()=>{ if(qty>1) qty--; updateQty(); });
    function updateQty(){
      document.getElementById('qty-val').textContent = qty;
      const totalEl = document.getElementById('fd-total');
      if(totalEl) totalEl.textContent = item.price * qty;
    }

    document.getElementById('add-cart-btn').addEventListener('click', ()=>{
      const instructions = document.getElementById('instructions').value.trim();
      qlAddToCart(item.id, qty, instructions);
      qlToast(`${item.name} added to cart`);
      qlUpdateCartBadge();
    });
  }
</script>
</body>
</html>
