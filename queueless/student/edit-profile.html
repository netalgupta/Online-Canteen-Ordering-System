<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Profile — QueueLess</title><link rel="stylesheet" href="../css/style.css"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script><style>.edit-wrap{max-width:620px;margin:0 auto;padding:20px 0 70px}.edit-card{margin-top:18px}.form-actions{display:flex;gap:10px;margin-top:18px}.form-actions .btn{flex:1}@media(max-width:600px){.form-actions{flex-direction:column}}</style></head><body><nav class="topnav"><div class="topnav-inner"><a href="dashboard.html" class="brand"><span class="brand-mark">Q</span>QueueLess</a><div class="nav-links"><a href="dashboard.html">Home</a><a href="menu.html">Menu</a><a href="history.html">Orders</a><a href="profile.html" class="active">Profile</a></div><div class="nav-right"><a href="cart.html" class="cart-btn"><i data-lucide="shopping-bag"></i><span class="cart-count">0</span></a></div></div></nav><main class="container edit-wrap"><div class="page-exit-row"><a href="profile.html" class="page-back"><i data-lucide="arrow-left"></i> Back to profile</a></div><h1 style="font-size:24px;margin-top:24px">Edit Profile</h1><p class="muted text-sm">Update the information shown on your QueueLess account.</p><div class="card card-pad edit-card"><div class="field"><label>Full name</label><input id="edit-name" type="text"></div><div class="field"><label>College email</label><input id="edit-email" type="email"></div><div class="field"><label>Phone</label><input id="edit-phone" type="tel" placeholder="Optional"></div><div class="form-actions"><a href="profile.html" class="btn btn-outline">Cancel</a><button class="btn btn-primary" id="save-btn">Save Changes</button></div></div></main><script src="../js/auth.js"></script><script src="../js/data.js"></script><script src="../js/orders.js"></script><script>if(!qlRequireAuth())throw new Error('Unauthorized');const user=qlGetUser();document.getElementById('edit-name').value=user.name||'';document.getElementById('edit-email').value=user.email||'';document.getElementById('edit-phone').value=user.phone||'';document.getElementById('save-btn').onclick=()=>{const updated={...user,name:document.getElementById('edit-name').value.trim()||user.name,email:document.getElementById('edit-email').value.trim()||user.email,phone:document.getElementById('edit-phone').value.trim()};localStorage.setItem('ql_user',JSON.stringify(updated));if(typeof qlToast==='function')qlToast('Profile updated');setTimeout(()=>location.href='profile.html',350)};if(window.qlIcons)qlIcons();</script></body></html>
