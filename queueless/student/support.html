ile.html" class="avatar">P</a></div></div></nav><main class="container account-page"><div class="page-exit-row"><a href="profile.html" class="page-back"><i data-lucide="arrow-left"></i> Back to profile</a></div><div class="account-head"><h1>Support</h1><p class="muted text-sm">Siddhi Services Canteen</p></div><div class="setting-card"><h3 style="font-size:16px">How can we help?</h3><p class="muted text-sm">For an order issue, keep your order token ready so the canteen team can help quickly.</p><a class="setting-link" href="contact.html"><span class="setting-icon"><i data-lucide="message-circle"></i></span><span class="setting-copy"><strong>Contact Support</strong><span>Reach the canteen support team</span></span><i data-lucide="chevron-right"></i></a><a class="setting-link" href="report.html"><span class="setting-icon"><i data-lucide="flag"></i></span><span class="setting-copy"><strong>Report a Problem</strong><span>Report a technical or order issue</span></span><i data-lucide="chevron-right"></i></a><a class="setting-link" href="help.html"><span class="setting-icon"><i data-lucide="circle-help"></i></span><span class="setting-copy"><strong>Browse Help & FAQ</strong><span>Find quick answers</span></span><i data-lucide="chevron-right"></i></a></div></main><script src="../js/auth.js"></script><script src="../js/data.js"></script><script src="../js/app.js"></script><script>if(!qlRequireAuth()){throw new Error('Unauthorized');}</script><script></script></body></html>
