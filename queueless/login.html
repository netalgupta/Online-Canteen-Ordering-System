<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — QueueLess</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-card{width:100%; max-width:400px;}
  .auth-brand{display:flex; align-items:center; gap:9px; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:20px; margin-bottom:26px;}
  .auth-card .card{padding:32px;}
  .auth-card h1{font-size:22px; margin-bottom:6px;}
  .auth-card p.sub{color:var(--ink-soft); font-size:13.5px; margin-bottom:24px;}
  .auth-foot{text-align:center; margin-top:20px; font-size:13.5px; color:var(--ink-soft);}
  .auth-foot a{color:var(--ink); font-weight:600;}
  .access-note{padding:12px 13px;margin:0 0 18px;border-radius:10px;background:var(--crimson-tint);border:1px solid #f4c9cc;color:var(--crimson-dark);font-size:11.5px;line-height:1.45;}
  .access-note strong{display:block;font-size:12.5px;margin-bottom:2px;}
  .demo-access{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
  .demo-access p{font-size:11.5px;color:var(--ink-soft);margin-bottom:9px;}
  .demo-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .demo-buttons button{border:1px solid var(--line);background:var(--white);border-radius:10px;padding:9px 5px;font-size:11px;font-weight:700;cursor:pointer;}
  .demo-buttons button:hover{border-color:var(--crimson);background:var(--crimson-tint);color:var(--crimson-dark);}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="auth-brand"><span class="brand-mark">Q</span>QueueLess</a>
    <div class="card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to pre-order, track and collect.</p>

      <div class="access-note"><strong>Choose your workspace</strong>Select a role below to continue.</div>

      <form id="login-form">
        <div class="field">
          <label>College email</label>
          <input type="email" id="email" placeholder="arya@somaiya.edu" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-amber btn-block">Log In <i data-lucide="arrow-right"></i></button>
      </form>
      <div class="demo-access">
        <p>Quick access</p>
        <div class="demo-buttons">
          <button type="button" data-role="student">Student</button>
          <button type="button" data-role="admin">Admin</button>
          <button type="button" data-role="staff" data-counter="C1">Staff · Counter 1</button>
          <button type="button" data-role="staff" data-counter="C2">Staff · Counter 2</button>
          <button type="button" data-role="staff" data-counter="C3">Staff · Counter 3</button>
          <button type="button" data-role="staff" data-counter="C4">Staff · Counter 4</button>
        </div>
      </div>
    </div>
    <p class="auth-foot">New to QueueLess? <a href="register.html">Create an account</a></p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    const email = document.getElementById('email').value;
    const namePart = email.split('@')[0] || 'Student';
    const name = namePart.charAt(0).toUpperCase() + namePart.slice(1);
    const role = document.getElementById('login-form').dataset.role || 'student';
    qlLogin(name, email, role, true);
    window.location.href = qlRoleHome(role);
  });
document.querySelectorAll('.demo-buttons button').forEach(btn=>btn.addEventListener('click',()=>{
    const role=btn.dataset.role;
    const counter=btn.dataset.counter || (role==='staff'?'C4':null);
    const names={student:'Arya Menon',admin:'Siddhi Admin'};
    const emails={student:'arya@student.demo',admin:'admin@siddhi.demo'};
    const staffNames={C1:'Asha · Counter 1',C2:'Rohan · Counter 2',C3:'Neha · Counter 3',C4:'Vikram · Counter 4'};
    const staffEmails={C1:'staff.c1@sidddhi.demo',C2:'staff.c2@sidddhi.demo',C3:'staff.c3@sidddhi.demo',C4:'staff.c4@sidddhi.demo'};
    qlLogin(role==='staff'?staffNames[counter]:names[role], role==='staff'?staffEmails[counter]:emails[role], role, true, counter);
    window.location.href = qlRoleHome(role);
  }));
</script>
</body>
</html>
